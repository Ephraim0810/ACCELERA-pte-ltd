name: Accelera follow-up checks
on: [push, pull_request]
jobs:
  workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check payment-followup-demo/server.js
      - run: npm test
