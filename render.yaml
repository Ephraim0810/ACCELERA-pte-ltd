services:
  - type: web
    name: accelera-followup
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
      - key: STAFF_USERNAME
        value: analyst
      - key: STAFF_PASSWORD_HASH
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CASE_TOKEN_SECRET
        generateValue: true
      - key: TRUST_PROXY_HOPS
        value: "1"
