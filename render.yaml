services:
  - type: web
    name: casepilot-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: DEMO_ADMIN_USER
        sync: false
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: groq
      - key: AI_MODEL
        value: openai/gpt-oss-20b
